      <stop offset="72%" stop-color="#A855F7"/><stop offset="100%" stop-color="#8B33E0"/>
    </radialGradient>
    <radialGradient id="torso-bubble" cx="30%" cy="18%" r="92%">
      <stop offset="0%" stop-color="#e7cffd"/><stop offset="32%" stop-color="#cd9cfa"/>
      <stop offset="74%" stop-color="#A855F7"/><stop offset="100%" stop-color="#7a2dc5"/>
    </radialGradient>
    <linearGradient id="brazo-bubble" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B33E0"/><stop offset="30%" stop-color="#d8b3fb"/>
      <stop offset="62%" stop-color="#b269f8"/><stop offset="100%" stop-color="#7a2dc5"/>
