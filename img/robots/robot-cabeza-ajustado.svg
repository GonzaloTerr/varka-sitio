      <stop offset="100%" stop-color="#C4A9E0"/>
    </radialGradient>
    <radialGradient id="cerebro-bubble" cx="32%" cy="24%" r="82%">
      <stop offset="0%" stop-color="#91e9f7"/><stop offset="52%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#1898ab"/>
