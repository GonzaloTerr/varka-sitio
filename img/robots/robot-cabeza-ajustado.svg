      <stop offset="0%" stop-color="#8b6cba"/><stop offset="100%" stop-color="#4C1D95"/>
    </radialGradient>

    <!-- Los tres del sombrero, calculados a partir de SU color: la luz, el canto
         de abajo con rebote violeta y la sombra que tira sobre la cabeza. -->
    <radialGradient id="hg-bubble" cx="30%" cy="18%" r="88%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="46%" stop-color="#F4F1EA"/>
      <stop offset="100%" stop-color="#aba9a4"/>
    </radialGradient>
    <linearGradient id="ha-bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a19f9a"/>
      <stop offset="100%" stop-color="#c897f2"/>
    </linearGradient>
    <linearGradient id="hs-bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A0A2E" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1A0A2E" stop-opacity="0"/>
    </linearGradient>
    <!-- Volumen suelto, para las piezas con estampa: va ENCIMA del dibujo -->
    <radialGradient id="vol-bubble" cx="30%" cy="16%" r="90%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#1A0A2E" stop-opacity="0.42"/>
    </radialGradient>

    <filter id="dif-bubble" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="blur-bubble" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="lsuave-bubble" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="lhalo-bubble" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>

  

